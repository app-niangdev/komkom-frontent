<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>KomKom</title>
  <base href="/" />

  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <link href="favicon.ico" rel="icon" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body dir="ltr">
  <style>
    #vex-splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #faf5ff 0%, #ffffff 55%);
      z-index: 99999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      animation: vex-splash-screen-fade-in 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) both;
    }

    .vex-splash-screen-logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
    }

    .vex-splash-screen-logo-container img {
      z-index: 1;
      animation: vex-splash-screen-logo-pulse 2s ease-in-out infinite;
    }

    .vex-splash-screen-loader {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #B100FF;
      border-right-color: rgba(177, 0, 255, 0.35);
      animation: vex-splash-screen-spin 1.1s linear infinite;
    }

    .vex-splash-screen-loader--inner {
      inset: 12px;
      border-top-color: transparent;
      border-right-color: transparent;
      border-bottom-color: #B100FF;
      border-left-color: rgba(177, 0, 255, 0.25);
      animation: vex-splash-screen-spin-reverse 1.6s linear infinite;
    }

    .vex-splash-screen-title {
      color: #111827;
      font-size: 2rem;
      font-weight: 600;
      margin: 0;
      animation: vex-splash-screen-title-in 0.7s cubic-bezier(0.25, 0.8, 0.25, 1) 0.2s both;
    }

    .vex-splash-screen-dots {
      display: flex;
      gap: 0.4rem;
      margin-top: -0.75rem;
      animation: vex-splash-screen-title-in 0.7s cubic-bezier(0.25, 0.8, 0.25, 1) 0.35s both;
    }

    .vex-splash-screen-dots span {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: #B100FF;
      animation: vex-splash-screen-dot-bounce 1.2s ease-in-out infinite;
    }

    .vex-splash-screen-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .vex-splash-screen-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes vex-splash-screen-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes vex-splash-screen-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes vex-splash-screen-spin-reverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes vex-splash-screen-logo-pulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes vex-splash-screen-title-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes vex-splash-screen-dot-bounce {
      0%,
      80%,
      100% {
        opacity: 0.35;
        transform: scale(0.85);
      }

      40% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <div id="vex-splash-screen">
    <div class="vex-splash-screen-logo-container">
      <img height="100" width="100" loading="eager" src="assets/img/logo/logo.png" alt="" />
      <div class="vex-splash-screen-loader"></div>
      <div class="vex-splash-screen-loader vex-splash-screen-loader--inner"></div>
    </div>
    <h1 class="vex-splash-screen-title">Komkom</h1>
    <div class="vex-splash-screen-dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </div>

  <vex-root></vex-root>
</body>

</html>
