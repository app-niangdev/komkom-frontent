<vex-store-header [company]="company" [store]="store" [onBack]="goBack" pageSubtitle="Gérer votre boutique">
</vex-store-header>

<div class="h-full flex flex-col">

  <div class="flex-1 px-3 sm:px-4 mt-4">
    <div class="card mb-3 sm:mb-4 shadow-md rounded-lg bg-white overflow-hidden border border-primary-500">
      <div class="p-3 sm:p-4 md:p-6">
        <h2 class="text-lg sm:text-xl font-bold text-gray-800 mb-4 sm:mb-6">Outils de Gestion Manager</h2>

        <div *ngIf="managerNavigationLinks.length > 0" class="mt-4 sm:mt-6">
          <h3 class="text-base sm:text-lg font-semibold text-gray-700 mb-3 sm:mb-4">Tous les menus</h3>
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4">
            <button *ngFor="let link of managerNavigationLinks"
              class="flex flex-col items-center p-4 sm:p-6 bg-gradient-to-br from-white to-gray-50 hover:from-primary-50 hover:to-primary-100 rounded-xl transition-all duration-300 border border-gray-200 hover:border-primary-300 hover:shadow-lg group"
              (click)="navigateTo(link.route)">
              <div
                class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-primary-100 text-primary-600 mb-3 flex items-center justify-center group-hover:scale-110 transition-transform">
                <mat-icon style="width: 28px; height: 28px; font-size: 28px;">{{link.icon || 'link'}}</mat-icon>
              </div>
              <span class="text-sm font-medium text-gray-700 text-center leading-tight">{{link.label}}</span>
            </button>
          </div>
        </div>

        <div *ngIf="managerNavigationLinks.length === 0" class="text-center py-6 sm:py-8">
          <mat-icon class="text-gray-400 mb-2" style="width: 40px; height: 40px; font-size: 40px;">warning</mat-icon>
          <p class="text-gray-500 text-sm sm:text-base">Aucun outil de gestion disponible</p>
        </div>
      </div>
    </div>
  </div>

  <div class="flex-1 px-3 sm:px-4">
    <div class="card mb-3 sm:mb-4 shadow-md rounded-lg bg-white overflow-hidden border border-primary-500">
      <div class="p-3 sm:p-4 md:p-6">
        <div class="flex flex-col gap-3">

          <!-- Titre -->
          <p class="text-sm font-semibold text-gray-600 uppercase tracking-wider">Liste des Gérants de la boutique</p>

          <!-- Avec managers -->
          <div *ngIf="store.nb_managers; else noManager" class="flex flex-wrap gap-3">
            <div *ngFor="let manager of store.managers"
              class="flex items-center gap-3 bg-primary-50 rounded-xl px-4 py-2">
              <div
                class="w-8 h-8 rounded-lg bg-primary-100 text-primary-600 flex items-center justify-center font-bold text-xs shrink-0">
                {{ getInitials(manager.user.full_name) }}
              </div>
              <div>
                <p class="text-sm font-medium text-gray-800 whitespace-nowrap">{{ manager.user.full_name }}</p>
                <p class="text-xs text-primary-500 font-medium">
                  <span>{{ manager.user.phone_number_one }}</span>
                  <span *ngIf="manager.user.phone_number_two">&nbsp;- {{ manager.user.phone_number_two }}</span>
                </p>
              </div>
            </div>
          </div>

          <!-- Aucun manager -->
          <ng-template #noManager>
            <div class="flex items-center gap-2 text-gray-400">
              <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-xs font-bold">
                N/A
              </div>
              <p class="text-sm font-medium">Pas de Gérant</p>
            </div>
          </ng-template>

        </div>
      </div>
    </div>
  </div>
</div>
